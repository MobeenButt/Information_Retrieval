<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Search Engine</title>
<style>
  :root {
    --ink: #16233a;
    --muted: #5b6b82;
    --paper: #f2f5f9;
    --card: #ffffff;
    --rule: #cdd7e3;
    --blue: #2f5d8c;
    --mark: #f6d28b;
    --serif: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font: 600 2rem/1.2 var(--serif); margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  form { display: flex; gap: 8px; }
  input[type=search] { flex: 1; font: inherit; padding: 12px 14px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 3px; }
  button, select { font: inherit; }
  .go { padding: 12px 22px; border: 0; background: var(--blue); color: #fff; border-radius: 3px; cursor: pointer; font-weight: 600; }
  .go:hover { background: #254b73; }
  :focus-visible { outline: 3px solid #e9a23b; outline-offset: 2px; }

  .opts { display: flex; flex-wrap: wrap; gap: 16px 24px; margin: 14px 0 6px; color: var(--muted); font-size: .92rem; align-items: center; }
  .opts select { padding: 4px 8px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 3px; }
  .opts label { display: inline-flex; gap: 6px; align-items: center; }

  .examples { margin: 10px 0 0; font-size: .92rem; color: var(--muted); }
  .examples button { background: none; border: 0; padding: 0 2px; color: var(--blue); text-decoration: underline; cursor: pointer; margin-right: 8px; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; margin-top: 28px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .trace { order: -1; position: static !important; } }

  .summary { color: var(--muted); font-size: .92rem; margin: 0 0 12px; }
  .hit { background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--blue); padding: 14px 16px 12px; margin-bottom: 12px; }
  .hit h2 { font: 600 1.15rem/1.3 var(--serif); margin: 0; }
  .hit h2 button { all: unset; cursor: pointer; color: var(--blue); }
  .hit h2 button:hover { text-decoration: underline; }
  .hit h2 button:focus-visible { outline: 3px solid #e9a23b; outline-offset: 2px; }
  .bar { height: 3px; background: var(--rule); margin: 8px 0; }
  .bar span { display: block; height: 100%; background: var(--blue); }
  .snippet { margin: 0 0 8px; }
  mark { background: var(--mark); color: inherit; padding: 0 1px; }
  .meta { font-size: .85rem; color: var(--muted); }
  .full { margin: 10px 0 4px; padding-top: 10px; border-top: 1px dashed var(--rule); }
  .empty { background: var(--card); border: 1px dashed var(--rule); padding: 20px; color: var(--muted); }

  .trace { position: sticky; top: 16px; background: var(--card); border: 1px solid var(--rule); padding: 16px 18px; }
  .trace h3 { font: 600 1.05rem/1.3 var(--serif); margin: 0 0 4px; }
  .trace p.note { font-size: .85rem; color: var(--muted); margin: 0 0 12px; }
  .trace ol { margin: 0; padding-left: 20px; }
  .trace li { margin-bottom: 12px; font-size: .9rem; }
  .trace li b { display: block; font-weight: 600; }
  .trace code { font: .88rem/1.5 ui-monospace, Consolas, monospace; background: var(--paper); padding: 1px 5px; border-radius: 2px; word-break: break-word; }
  .trace .none { color: var(--muted); }
  .lookup { display: block; margin: 2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mini Search Engine</h1>
  <p class="sub" id="stats">Loading collection…</p>

  <form id="form" role="search">
    <input type="search" id="q" placeholder="Try: how do search engines rank results" aria-label="Search query" autocomplete="off" autofocus>
    <button class="go" type="submit">Search</button>
  </form>

  <div class="opts">
    <label>Ranking model
      <select id="model"><option value="tfidf">TF-IDF</option><option value="bm25">BM25</option></select>
    </label>
    <label><input type="radio" name="mode" value="any" checked> Match any word</label>
    <label><input type="radio" name="mode" value="all"> Match all words</label>
  </div>
  <p class="examples">Examples:
    <button type="button" data-q="machine learning">machine learning</button>
    <button type="button" data-q="inverted index">inverted index</button>
    <button type="button" data-q="how do search engines rank results">how do search engines rank results</button>
    <button type="button" data-q="precision recall">precision recall</button>
  </p>

  <div class="layout">
    <section aria-live="polite">
      <p class="summary" id="summary"></p>
      <div id="results"><div class="empty">Type a query to search the collection. Select a result title to read the full document.</div></div>
    </section>

    <aside class="trace" id="trace">
      <h3>What the engine did</h3>
      <p class="note">Each search runs through the same pipeline you studied in Week 1.</p>
      <p class="none">Run a search to see the steps.</p>
    </aside>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const list = (a) => a.length ? a.join(", ") : "(none)";

fetch("/stats").then(r => r.json()).then(s => {
  $("#stats").textContent = `Searching ${s.documents} documents with ${s.terms} indexed terms.`;
});

function renderTrace(t, query) {
  const box = $("#trace");
  box.replaceChildren();
  box.append(el("h3", "", "What the engine did"));
  box.append(el("p", "note", "Each search runs through the same pipeline you studied in Week 1."));
  const ol = el("ol");
  const step = (title, content) => { const li = el("li"); li.append(el("b", "", title)); li.append(content); ol.append(li); };
  const code = (txt) => el("code", "", txt);

  step("You typed", code(query));
  step("Split into words", code(list(t.tokens)));
  step("Common words removed", code(list(t.no_stop)));
  step("Reduced to stems", code(list(t.stems)));
  const lk = el("div");
  if (!t.lookups.length) lk.append(el("span", "none", "No searchable terms in this query."));
  t.lookups.forEach(l => {
    const row = el("span", "lookup");
    row.append(code(l.term), document.createTextNode(l.df ? ` found in ${l.df} document${l.df > 1 ? "s" : ""}` : " not in the index"));
    lk.append(row);
  });
  step("Looked up in the index", lk);
  step("Ranked by relevance", el("span", "", "Documents sharing more, and rarer, terms with the query score higher."));
  box.append(ol);
}

function renderHits(data) {
  const res = $("#results");
  res.replaceChildren();
  const n = data.total;
  $("#summary").textContent = n
    ? `${n} result${n > 1 ? "s" : ""} in ${data.took_ms} ms. Showing the top ${data.hits.length}.`
    : "";
  if (!n) {
    const e = el("div", "empty");
    e.textContent = data.trace.stems.length
      ? "No documents match. Try fewer words, or switch to “Match any word”."
      : "Your query contains only common words. Add a more specific term.";
    res.append(e);
    return;
  }
  const top = data.hits[0].score || 1;
  data.hits.forEach((h, i) => {
    const card = el("article", "hit");
    const title = el("h2");
    const btn = el("button", "", `${i + 1}. ${h.title}`);
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    title.append(btn);

    const bar = el("div", "bar"); const fill = el("span"); fill.style.width = Math.max(4, (h.score / top) * 100) + "%"; bar.append(fill);
    const snip = el("p", "snippet"); snip.innerHTML = h.snippet;  // server-escaped; only <mark> tags added
    const meta = el("div", "meta", `Score ${h.score} · matched ${h.matched.length} of ${data.trace.lookups.length} terms`);
    card.append(title, bar, snip, meta);

    let full = null;
    btn.addEventListener("click", async () => {
      if (full) { full.remove(); full = null; btn.setAttribute("aria-expanded", "false"); return; }
      const doc = await (await fetch(`/doc?id=${h.id}`)).json();
      full = el("p", "full", doc.text);
      card.append(full);
      btn.setAttribute("aria-expanded", "true");
    });
    res.append(card);
  });
}

async function search(q) {
  q = q.trim();
  if (!q) return;
  const mode = document.querySelector("input[name=mode]:checked").value;
  const url = `/search?q=${encodeURIComponent(q)}&model=${$("#model").value}&mode=${mode}&k=10`;
  const resp = await fetch(url);
  const data = await resp.json();
  if (!resp.ok) { $("#results").replaceChildren(el("div", "empty", data.error || "Search failed.")); return; }
  history.replaceState(null, "", `?q=${encodeURIComponent(q)}`);
  renderTrace(data.trace, q);
  renderHits(data);
}

$("#form").addEventListener("submit", (e) => { e.preventDefault(); search($("#q").value); });
document.querySelectorAll(".examples button").forEach(b => b.addEventListener("click", () => { $("#q").value = b.dataset.q; search(b.dataset.q); }));
$("#model").addEventListener("change", () => search($("#q").value));
document.querySelectorAll("input[name=mode]").forEach(r => r.addEventListener("change", () => search($("#q").value)));

const initial = new URLSearchParams(location.search).get("q");
if (initial) { $("#q").value = initial; search(initial); }
</script>
</body>
</html>
